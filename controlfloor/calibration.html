<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mouse calibration · UxPlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#101c24;color:#e8f1f5;font:14px system-ui,sans-serif}
header{position:absolute;top:0;left:0;right:0;padding:12px 16px;pointer-events:none}h1{font-size:17px;margin:0 0 4px}#status{font-size:12px;color:#bad0dc;margin:0;overflow-wrap:anywhere}
#surface{position:absolute;left:8px;right:8px;top:72px;bottom:60px;background:#f7fbfc;border:1px solid #8fa6b3;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{width:100%;height:100%;display:block;pointer-events:none}#hint{position:absolute;top:12px;left:12px;right:12px;color:#54707e;font-size:12px;pointer-events:none}
footer{position:absolute;bottom:0;left:0;right:0;min-height:52px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:#bad0dc}
button{font:inherit;padding:8px 14px;border:1px solid #537181;border-radius:7px;background:#263d49;color:#fff}body.failed #status{color:#ffb7a7}body.done #status{color:#92e9bb}
</style></head><body>
<header><h1>Mouse calibration</h1><p id="status" role="status">Waiting for the page to settle…</p></header>
<div id="surface"><canvas id="trace"></canvas><div id="hint">Keep this page open in portrait. Please leave the mouse and screen untouched.</div></div>
<footer><span id="detail">UxPlay · local calibration</span><button id="cancel" type="button">Cancel</button></footer>
<script src="/mouse-calibration.js"></script><script src="/mouse-calibration-page.js"></script>
</body></html>
